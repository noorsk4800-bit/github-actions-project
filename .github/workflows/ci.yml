name: My First CI Workflow

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current workspace
        run: pwd

      - name: List repository files
        run: ls -la

      - name: Read application file
        run: cat app.txt

